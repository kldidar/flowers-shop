<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Boutique look: big photo on top, sticky category tabs, large photo cards,
   a floating glass cart pill and a full-page cart. Black buttons, deep-rose accent.
   A shop can change the accent with "theme": {"accent": "#RRGGBB"} in its config,
   and give a category a wide picture with "banner": "https://…". */
:root{
  --bg:#F6F4F8; --card:#FFFFFF; --ink:#18161B; --muted:#7A7480; --line:#ECE8F0; --chip:#F0EDF3;
  --accent:#B3123F; --soft:#F5E3EC; --btn:#18161B; --btn-ink:#FFFFFF; --ok:#1F8A5B;
  --glass:rgba(255,255,255,.80); --shadow:0 10px 30px rgba(24,22,27,.07); --radius:26px;
}
[data-theme="dark"]{
  --bg:#131115; --card:#1D1A20; --ink:#F4F0F5; --muted:#A49EA9; --line:#2C2830; --chip:#28242C;
  --soft:#3A2431; --btn:#F4F0F5; --btn-ink:#131115; --glass:rgba(32,28,35,.82); --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--ink)}
img{display:block;max-width:100%}
svg{display:block}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.shell{max-width:720px;margin:0 auto;padding-bottom:110px}
.emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.ph img,.lth img,.mth img,.big img,.banner img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}

/* icon buttons */
[data-theme="dark"] .eyebrow{color:color-mix(in srgb,var(--accent) 50%,#fff)}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#18161B;
  box-shadow:0 4px 14px rgba(0,0,0,.12);position:relative;flex:none;transition:transform .12s}
.ico:active{transform:scale(.93)}
.ico.flat{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.ico.sm{width:40px;height:40px}
.dot{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;border:2px solid #fff}
.dot.on{display:grid}

/* hero */
.hero{position:relative;height:clamp(400px,70vh,620px);overflow:hidden;border-radius:0 0 32px 32px;
  background:linear-gradient(160deg,var(--accent),#2A0F1B)}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out both}
@keyframes zoom{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%)}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:16px}
.mark{flex:1;min-width:0;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.mark b{display:block;font-size:30px;line-height:1;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark small{display:block;margin-top:6px;font-size:12px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}
.lang{display:flex;align-items:center;height:44px;padding:4px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.lang button{width:36px;height:36px;border-radius:50%;font-size:12px;font-weight:800;color:#8A848F}
.lang button.on{background:#18161B;color:#fff}
.hero-card{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:14px;text-align:left;color:#fff;
  padding:16px 14px 16px 20px;border-radius:26px;background:rgba(36,28,33,.42);backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid rgba(255,255,255,.18);animation:rise .6s .15s ease both}
.hero-card .hc{flex:1;min-width:0}
.hero-card b{display:block;font-size:19px;font-weight:700;line-height:1.25}
.hero-card span{display:block;font-size:17px;font-weight:600;margin-top:4px}
.hero-card small{display:block;font-size:12px;opacity:.85;margin-top:6px}
.hero-card i{width:50px;height:50px;border-radius:50%;background:#fff;color:#18161B;display:grid;place-items:center;flex:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.preview{margin:14px 16px 0;background:#FFF4D6;color:#5B4A12;font-size:12.5px;padding:9px 12px;border-radius:14px;font-weight:600}

/* sticky tabs */
.tabs{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:8px;padding:12px 16px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tablist{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:none;height:42px;padding:0 16px;border-radius:99px;font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s}
.tab.on{background:var(--soft)}
.sfield{flex:1;position:relative}
.sfield svg{position:absolute;left:14px;top:12px;color:var(--muted)}
.sfield input{width:100%;height:44px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 42px;outline:none}
.sfield input:focus{border-color:var(--ink)}

/* sections + cards */
.sec{padding:22px 16px 6px;scroll-margin-top:72px}
.sec-head{margin:0 2px 14px}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.sec-head h2{margin:4px 0 0;font-size:36px;line-height:1.05;font-weight:600}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.banner{position:relative;aspect-ratio:16/11;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;background:var(--soft)}
.banner::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
.banner .bi{position:absolute;left:20px;right:20px;bottom:18px;z-index:2;color:#fff}
.banner h2{margin:0;font-size:40px;line-height:1;font-weight:600}
.banner p{margin:6px 0 0;font-size:14px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:rise .4s ease both}
.ph{position:relative;aspect-ratio:4/5;background:linear-gradient(150deg,var(--soft),var(--chip));overflow:hidden;cursor:pointer}
.ph img{transition:transform .5s ease}
.card:active .ph img{transform:scale(1.04)}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;flex:1}
.cb h3{margin:0;font-size:14.5px;font-weight:600;line-height:1.3;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb p{margin:3px 0 0;color:var(--muted);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.buy{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 6px;margin-top:auto;padding-top:10px}
.buy>span:last-child:has(.qty){flex-basis:100%}
.card .qty{width:100%;justify-content:space-between}
.card .qty button{width:42px}
.price{font-size:15.5px;font-weight:800;white-space:nowrap}
.add{width:40px;height:40px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none;transition:transform .12s}
.add:active{transform:scale(.9)}
.qty{display:flex;align-items:center;height:40px;border-radius:99px;background:var(--btn);color:var(--btn-ink)}
.qty button{width:34px;height:40px;display:grid;place-items:center}
.qty b{min-width:16px;text-align:center;font-size:14px}
.qty.soft{background:var(--chip);color:var(--ink);height:44px}
.qty.soft button{width:44px;height:44px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}

/* floating cart pill */
.cartpill{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;width:min(calc(100% - 32px),460px);height:70px;
  display:flex;align-items:center;gap:10px;padding:0 9px 0 24px;border-radius:99px;background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid color-mix(in srgb,var(--card) 70%,transparent);
  box-shadow:0 16px 40px rgba(24,22,27,.18);transform:translate(-50%,150%);transition:transform .35s cubic-bezier(.2,.9,.25,1.15);text-align:left}
.cartpill.show{transform:translate(-50%,0)}
.cartpill.bump{animation:bump .35s ease}
@keyframes bump{50%{transform:translate(-50%,0) scale(1.04)}}
.cartpill .pt{flex:1;min-width:0}
.cartpill .pt b{display:block;font-size:19px;font-weight:800;white-space:nowrap}
.cartpill .pt small{color:var(--muted);font-size:12px;font-weight:600}
.thumbs{display:flex;padding-left:14px}
.thumbs span{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;margin-left:-14px;border:2px solid var(--card);
  background:var(--soft);display:grid;place-items:center;font-size:20px}
.thumbs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cartpill .go{width:52px;height:52px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}

/* full pages: cart, checkout, done */
.page{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;
  transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.page.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pwrap{max-width:720px;margin:0 auto;padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
.ptop{display:flex;align-items:center;justify-content:space-between;height:52px}
.ptitle{margin:8px 0 2px;font-size:44px;line-height:1;font-weight:600}
.psub{margin:6px 0 4px;color:var(--muted)}
.ln{display:flex;gap:14px;background:var(--card);border-radius:var(--radius);padding:14px;margin-top:12px;border:1px solid var(--line);animation:rise .3s ease both}
.lth{position:relative;width:96px;height:96px;border-radius:20px;overflow:hidden;flex:none;background:var(--soft);cursor:pointer}
.lth .emoji,.mth .emoji{font-size:30px}
.lb{flex:1;min-width:0;display:flex;flex-direction:column}
.lt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lt b{font-size:15.5px;font-weight:600;line-height:1.3}
.trash{width:32px;height:32px;border-radius:50%;color:var(--muted);display:grid;place-items:center;flex:none;margin:-4px -4px 0 0}
.lb small{color:var(--muted);font-size:13px;margin:3px 0 10px}
.lfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.lsum{font-size:17px;font-weight:800;white-space:nowrap}
.link{color:var(--muted);font-weight:600;padding:18px 2px 6px}
.up-h{margin:22px 2px 12px;font-size:17px;font-weight:700}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 8px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:none;width:262px;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:22px;padding:10px 10px 10px 10px;
  border:1px solid var(--line);scroll-snap-align:start}
.mth{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;flex:none;background:var(--soft);cursor:pointer}
.mb{flex:1;min-width:0}
.mb b{font-size:13.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.mb span{display:block;font-weight:800;font-size:14px;margin-top:6px}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:26;padding:10px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.pbar-in{pointer-events:auto;max-width:688px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:99px;
  padding:8px 8px 8px 24px;box-shadow:0 14px 36px rgba(24,22,27,.16);border:1px solid var(--line)}
.pbar-in b{flex:1;min-width:0;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar-in .btn{padding:0 20px;gap:6px}
@media (max-width:400px){.pbar-in .btn svg{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:99px;
  background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:15.5px;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.wide{width:100%}

/* checkout */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:99px;padding:4px;margin:18px 0 4px}
.seg button{height:44px;border-radius:99px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.hint{font-size:13px;color:var(--muted);margin:10px 4px 0}
.progress{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 14px;font-size:13.5px;font-weight:600}
.progress .track{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:9px}
.progress .fill{height:100%;background:linear-gradient(90deg,#E9A2B8,var(--accent));border-radius:9px;transition:width .3s}
.field{margin-top:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 6px}
.field input,.field textarea{width:100%;border-radius:18px;border:1px solid var(--line);background:var(--card);padding:14px 16px;outline:none;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field.err input,.field.err textarea{border-color:#D6334F}
.field .e{display:none;color:#D6334F;font-size:12px;margin:5px 6px 0;font-weight:600}
.field.err .e{display:block}
.totals{background:var(--card);border-radius:22px;padding:16px 18px;margin:18px 0 12px;border:1px solid var(--line)}
.totals div{display:flex;justify-content:space-between;gap:10px;margin:5px 0;color:var(--muted)}
.totals .all{color:var(--ink);font-weight:800;font-size:18px;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.pay{display:flex;gap:10px;font-size:13px;color:var(--muted);margin:0 6px}

/* product sheet */
.sheet{position:fixed;inset:0;z-index:30;display:none}
.sheet.open{display:block}
.shade{position:absolute;inset:0;background:rgba(12,10,14,.5);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
.pin{max-width:720px;margin:0 auto;padding:12px 16px calc(22px + env(safe-area-inset-bottom));position:relative}
.big{position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,var(--soft),var(--chip))}
.big .emoji{font-size:80px}
.pin .close{position:absolute;right:28px;top:24px;z-index:3}
.pinfo h2{margin:18px 0 4px;font-size:32px;line-height:1.08;font-weight:600}
.pinfo .pp{font-size:20px;font-weight:800;margin:0 0 10px}
.pinfo p{margin:0 0 12px;color:var(--muted)}
.facts{display:grid;gap:8px;margin:4px 0 14px}
.fact{display:flex;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;border:1px solid var(--line)}
.fact i{font-style:normal;font-size:18px}
.fact b{display:block;font-size:12px;color:var(--muted);font-weight:700}
.note{font-size:12px;color:var(--muted);font-style:italic}
.addrow{display:flex;gap:10px;align-items:center;margin-top:6px}
.addrow .qty.soft{height:54px}
.addrow .qty.soft button{height:54px}
.addrow .btn{flex:1;min-width:0}

/* done + toast */
.done{text-align:center;padding:60px 10px 10px}
.done .ok{width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;font-size:44px;background:var(--soft);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}}
.done h2{margin:0 0 8px;font-size:36px;font-weight:600}
.done p{color:var(--muted);margin:0 0 22px}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:700;font-size:13.5px;transition:.25s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{display:grid;place-items:center;height:80vh;color:var(--muted);font-weight:700;font-size:40px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">🌸</div></div>
<button class="cartpill" id="pill" aria-label="cart">
  <span class="pt"><b id="pillSum"></b><small id="pillCount"></small></span>
  <span class="thumbs" id="pillThumbs"></span>
  <span class="go"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
</button>
<div class="page" id="page"></div>
<div class="sheet" id="sheet"><div class="shade" data-close></div><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
// Inside Telegram the platform is "android", "ios", "tdesktop", "weba"…; in a normal browser
// it is "unknown". (initData can't be used for this: it is EMPTY when the app is opened from
// a keyboard button, which is exactly how this shop is opened.)
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
const qs = new URLSearchParams(location.search);
const slug = (qs.get("shop") || "example_flowers").replace(/[^a-z0-9_]/gi, "");
const showPreview = !inTG && !qs.get("embed");   // ?embed=1: shown inside the portfolio, no browser note

const T = {
  ru: {
    heroTitle: "Свежие цветы с доставкой по Ташкенту", from: "от", delivery: "Доставка", freeFrom: "бесплатно от", pickup: "Самовывоз",
    search: "Поиск: розы, тюльпаны, коробка…", found: "Найдено", nothing: "Ничего не нашлось 🌾 Попробуйте другое слово.",
    comp: "Состав", size: "Размер", add: "В корзину", added: "Добавлено в корзину",
    cart: "Корзина", yourOrder: "Ваш заказ", itemsN: "Товаров", perUnit: "за шт.", clear: "Очистить корзину",
    alsoBuy: "С этим покупают", checkout: "Оформить заказ", emptyCart: "Корзина пока пуста", toShop: "Перейти к покупкам",
    step2: "Оформление", step2Title: "Доставка и контакты",
    methodDelivery: "🚚 Доставка", methodPickup: "🏪 Самовывоз", pickupAt: "Забрать по адресу",
    left: "Ещё {x} — и доставка бесплатно", freeOk: "🎉 Доставка бесплатно!",
    name: "Ваше имя", phone: "Телефон", address: "Адрес доставки", addressPh: "Район, улица, дом, ориентир",
    comment: "Комментарий", commentPh: "Время доставки, текст открытки, пожелания",
    eName: "Укажите имя", ePhone: "Проверьте номер", eAddr: "Укажите адрес",

let shop = null, lang = "ru", cart = {}, q = "", searching = false, method = null, form = {}, view = null, activeTab = -1;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = k => (T[lang] && T[lang][k]) || T.ru[k] || k;
const loc = v => v && typeof v === "object" ? (v[lang] || v.ru || Object.values(v)[0] || "") : (v || "");
const money = n => n.toLocaleString("ru-RU").replace(/\s/g, " ") + " " + loc(shop.currency || "сум");
const fromPrice = n => lang === "uz" ? money(n) + " " + t("from") : t("from") + " " + money(n);
const haptic = kind => { try { inTG && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} };
const brand = () => shop.business_name.replace(/\s*\(DEMO\)\s*$/i, "");
const emoji = () => shop.emoji || "🌸";
function plural(n) {
  if (lang !== "ru") return "ta";
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? "товар" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "товара" : "товаров";
}
// "🌹 Розы" → ["🌹", "Розы"]
function splitTitle(s) {
  const m = String(s).match(/^(\S+)\s+(.+)$/);
  return m && !/[\p{L}\p{N}]/u.test(m[1]) ? [m[1], m[2]] : ["", String(s)];
}

/* ---------- data ---------- */
let items = [];
function index() {
  items = [];
  for (const c of shop.categories) for (const it of c.items) items.push(Object.assign({ cat: c.id }, it));
}
const byId = id => items.find(i => i.id === id);
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const subtotal = () => Object.entries(cart).reduce((s, [id, n]) => s + (byId(id) ? byId(id).price * n : 0), 0);
const dlv = () => shop.delivery || {};
const feeTbd = () => !!dlv().enabled && ("fee" in dlv()) && dlv().fee === null;
const methods = () => [dlv().enabled && "delivery", shop.pickup_address && "pickup"].filter(Boolean);
function fee() {
  if (method !== "delivery" || !dlv().enabled || feeTbd()) return 0;
  const ff = dlv().free_from;
  return ff && subtotal() >= ff ? 0 : (dlv().fee || 0);
}
const photo = i => i && i.photo ? `<img src="${esc(i.photo)}" alt="" loading="lazy" onerror="this.remove()">` : "";
const thumb = i => `<span class="emoji">${esc(emoji())}</span>${photo(i)}`;

/* ---------- storefront ---------- */
function render() {
  document.documentElement.lang = lang;
  document.title = brand();
  const d = dlv();
  const hero = shop.hero_photo || shop.welcome_photo || (items.find(i => i.photo) || {}).photo;
  const min = items.length ? Math.min(...items.map(i => i.price)) : 0;
  const perks = [];
  if (d.enabled) perks.push("🚚 " + t("delivery") + (d.free_from && !feeTbd() ? " · " + t("freeFrom") + " " + money(d.free_from) : ""));
  if (shop.pickup_address) perks.push("🏪 " + t("pickup"));
  const langs = (shop.languages || ["ru"]).filter(l => T[l]);

  $("#app").innerHTML = `<div class="shell">
    <section class="hero">
      ${hero ? `<img class="hero-img" src="${esc(hero)}" alt="" onerror="this.remove()">` : ""}
      <div class="hero-shade"></div>
      <header class="top">
        <div class="mark"><b class="serif">${esc(brand())}</b></div>
        <div class="acts">
          ${langs.length > 1 ? `<div class="lang">${langs.map(l => `<button data-lang="${l}" class="${l === lang ? "on" : ""}">${l.toUpperCase()}</button>`).join("")}</div>` : ""}
          <button class="ico" data-act="cart" aria-label="${esc(t("cart"))}">${I.bag}<span class="dot" id="hdrCount"></span></button>
        </div>
      </header>
      <button class="hero-card" data-act="catalog">
        <span class="hc"><b>${esc(loc(shop.hero_title) || loc(shop.tagline) || t("heroTitle"))}</b>
          ${min ? `<span>${esc(emoji())} ${esc(fromPrice(min))}</span>` : ""}
          ${perks.length ? `<small>${esc(perks.join("  ·  "))}</small>` : ""}</span>
        <i>${I.arrowUR}</i>
      </button>
    </section>
    ${showPreview ? `<div class="preview">${esc(t("preview"))}</div>` : ""}
    <nav class="tabs" id="tabs"></nav>
    <main id="catalog"></main>
  </div>`;
  renderNav();
  renderCatalog();
  renderBar();
  activeTab = -1; spy();
}

function renderNav() {
  const nav = $("#tabs");
  if (searching) {
    nav.innerHTML = `<div class="sfield">${I.search}<input id="q" type="search" placeholder="${esc(t("search"))}" value="${esc(q)}" autocomplete="off"></div>
      <button class="ico sm flat" data-act="unsearch" aria-label="close">${I.x}</button>`;
    return;
  }
  nav.innerHTML = `<button class="ico sm flat" data-act="search" aria-label="search">${I.search}</button>
    <div class="tablist" id="tablist">${shop.categories.map((c, n) => items.some(i => i.cat === c.id)
      ? `<button class="tab" data-tab="${n}">${esc(loc(c.title))}</button>` : "").join("")}</div>`;
}

function card(i, n) {
  const sub = loc(i.composition) || loc(i.description);
  return `<article class="card" style="animation-delay:${Math.min(n, 6) * 40}ms">
    <div class="ph" data-open="${esc(i.id)}">${thumb(i)}</div>
    <div class="cb"><h3 data-open="${esc(i.id)}">${esc(loc(i.title))}</h3>${sub ? `<p>${esc(sub)}</p>` : ""}
      <div class="buy"><span class="price">${esc(money(i.price))}</span><span data-buy="${esc(i.id)}">${buyBlock(i)}</span></div></div>
  </article>`;
}

function buyBlock(i) {
  const n = cart[i.id] || 0;
  return n ? `<div class="qty"><button data-dec="${esc(i.id)}" aria-label="-">${I.minus}</button><b>${n}</b><button data-inc="${esc(i.id)}" aria-label="+">${I.plus}</button></div>`
           : `<button class="add" data-inc="${esc(i.id)}" aria-label="${esc(t("add"))}">${I.plus}</button>`;
}

function renderCatalog() {
  const s = q.trim().toLowerCase();
  if (searching && s) {
    const list = items.filter(i => [loc(i.title), loc(i.description), loc(i.composition)].join(" ").toLowerCase().includes(s));
    $("#catalog").innerHTML = `<section class="sec"><div class="sec-head"><div class="eyebrow">${I.search} ${esc(t("found"))}: ${list.length}</div></div>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">${esc(t("nothing"))}</p>`}</section>`;
    return;
  }
  $("#catalog").innerHTML = shop.categories.map((c, n) => {
    const its = items.filter(i => i.cat === c.id);
    if (!its.length) return "";
    const [em, name] = splitTitle(loc(c.title));
    const min = Math.min(...its.map(i => i.price));
    const info = `${its.length} ${plural(its.length)} · ${fromPrice(min)}`;
    const head = c.banner
      ? `<div class="banner"><img src="${esc(c.banner)}" alt="" loading="lazy" onerror="this.remove()"><div class="bi"><h2 class="serif">${esc(name)}</h2><p>${esc(info)}</p></div></div>`
      : `<div class="sec-head"><div class="eyebrow">${em ? esc(em) : I.leaf} ${esc(info)}</div><h2 class="serif">${esc(name)}</h2></div>`;
    return `<section class="sec" id="sec${n}" data-sec="${n}">${head}<div class="grid">${its.map(card).join("")}</div></section>`;
  }).join("");
}

/* scroll-spy: highlight the tab of the section under the sticky bar */
function spy() {
  if (searching || !shop) return;
  const nav = $("#tabs"); if (!nav) return;
  const h = nav.offsetHeight + 24;
  let cur = -1;
  $$("[data-sec]").forEach(s => { if (s.getBoundingClientRect().top - h <= 0) cur = +s.dataset.sec; });
  if (cur === -1) { const first = $("[data-sec]"); cur = first ? +first.dataset.sec : -1; }
  if (cur === activeTab) return;
  activeTab = cur;
  const list = $("#tablist"); if (!list) return;
  $$(".tab", list).forEach(b => b.classList.toggle("on", +b.dataset.tab === cur));
  const on = $(".tab.on", list);
  if (on) list.scrollTo({ left: on.offsetLeft - (list.clientWidth - on.offsetWidth) / 2, behavior: "smooth" });
}
let spyQueued = false;
window.addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spy(); }); } }, { passive: true });

function scrollToSec(n) {
  const sec = document.getElementById("sec" + n), nav = $("#tabs");
  if (!sec) return;
  window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - nav.offsetHeight + 6, behavior: "smooth" });
}

/* ---------- cart pill ---------- */
function renderBar(bump) {
  if (!shop) return;
  const n = count();
  const pill = $("#pill");
  pill.classList.toggle("show", n > 0 && !view && !$("#sheet").classList.contains("open"));
  $("#pillSum").textContent = money(subtotal());
  $("#pillCount").textContent = `${t("cart")} · ${n} ${plural(n)}`;
  $("#pillThumbs").innerHTML = Object.keys(cart).slice(-3).map(id => `<span>${thumb(byId(id))}</span>`).join("");
  const dot = $("#hdrCount");
  if (dot) { dot.textContent = n; dot.classList.toggle("on", n > 0); }
  if (bump && n) { pill.classList.remove("bump"); void pill.offsetWidth; pill.classList.add("bump"); }
}

function refreshBuy(id) {
  const i = byId(id);
  $$(`[data-buy="${CSS.escape(id)}"]`).forEach(el => { el.innerHTML = buyBlock(i); });
  renderBar(true);
  if (view === "cart") renderPage();
}

/* ---------- cart ops ---------- */
function inc(id) { cart[id] = Math.min((cart[id] || 0) + 1, 99); haptic("light"); }
function dec(id) { cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id]; haptic("light"); }
let toastTimer;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ---------- navigation (Telegram back button follows it) ---------- */
function syncBack() {
  if (!inTG || !tg.BackButton) return;
  (view || $("#sheet").classList.contains("open")) ? tg.BackButton.show() : tg.BackButton.hide();
}
function lockScroll() { document.body.style.overflow = view || $("#sheet").classList.contains("open") ? "hidden" : ""; }
function showPage(v) {
  view = v;
  const page = $("#page");
  page.classList.add("open");
  renderPage();
  page.scrollTop = 0;
  lockScroll(); syncBack(); renderBar();
}
function closePage() {
  view = null;
  $("#page").classList.remove("open");
  lockScroll(); syncBack(); renderBar();
}
function goBack() {
  if ($("#sheet").classList.contains("open")) return closeSheet();
  if (view === "checkout") return showPage("cart");
  if (view) return closePage();
}

function renderPage() {
  if (view === "cart") return renderCart();
  if (view === "checkout") return renderCheckout();
}

/* ---------- cart page ---------- */
function renderCart() {
  const ids = Object.keys(cart), n = count();
  const top = `<div class="ptop"><button class="ico flat" data-act="back" aria-label="back">${I.back}</button></div>`;
  if (!ids.length) {
    $("#page").innerHTML = `<div class="pwrap">${top}<div class="done"><div class="ok">${esc(emoji())}</div>
      <h2 class="serif">${esc(t("emptyCart"))}</h2><button class="btn" data-act="back">${esc(t("toShop"))} ${I.arrow}</button></div></div>`;
    return;
  }
  const lines = ids.map(id => { const i = byId(id); return `
    <div class="ln"><div class="lth" data-open="${esc(id)}">${thumb(i)}</div>
      <div class="lb"><div class="lt"><b>${esc(loc(i.title))}</b><button class="trash" data-del="${esc(id)}" aria-label="delete">${I.trash}</button></div>
        <small>${esc(money(i.price))} ${esc(t("perUnit"))}</small>
        <div class="lfoot"><div class="qty soft"><button data-dec="${esc(id)}" aria-label="-">${I.minus}</button><b>${cart[id]}</b><button data-inc="${esc(id)}" aria-label="+">${I.plus}</button></div>

  const inCats = new Set(ids.map(id => byId(id).cat));

      <div class="mini"><div class="mth" data-open="${esc(i.id)}">${thumb(i)}</div>
        <div class="mb"><b data-open="${esc(i.id)}">${esc(loc(i.title))}</b><span>${esc(money(i.price))}</span></div>
        <button class="add" data-inc="${esc(i.id)}" aria-label="${esc(t("add"))}">${I.plus}</button></div>`).join("")}</div>` : ""}
  </div>
  <div class="pbar"><div class="pbar-in"><b>${esc(money(subtotal()))}</b><button class="btn" data-act="checkout">${esc(t("checkout"))} ${I.arrow}</button></div></div>`;

/* ---------- checkout page ---------- */
function openCheckout() {
  if (!count()) return;
  const ms = methods();
  if (!method || !ms.includes(method)) method = ms[0] || "pickup";
  if (!form.name && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) form.name = tg.initDataUnsafe.user.first_name || "";
  showPage("checkout");
}

function renderCheckout() {
  const ms = methods(), d = dlv(), sub = subtotal();
  let progress = "";
  if (method === "delivery" && d.free_from && !feeTbd()) {
    const pct = Math.min(100, Math.round(sub / d.free_from * 100));
    progress = `<div class="progress">${sub >= d.free_from ? esc(t("freeOk")) : esc(t("left").replace("{x}", money(d.free_from - sub)))}
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }
  const feeTxt = method !== "delivery" ? "" : feeTbd() ? t("tbd") : fee() === 0 ? t("free") : money(fee());
  const fld = (key, label, ph, type, area) => `<div class="field" id="f-${key}"><label>${esc(label)}</label>
    ${area ? `<textarea rows="2" data-f="${key}" placeholder="${esc(ph)}">${esc(form[key] || "")}</textarea>`
           : `<input data-f="${key}" type="${type || "text"}" placeholder="${esc(ph)}" value="${esc(form[key] || "")}" ${type === "tel" ? 'inputmode="tel" autocomplete="tel"' : 'autocomplete="name"'}>`}
    <div class="e">${esc(t(key === "name" ? "eName" : key === "phone" ? "ePhone" : "eAddr"))}</div></div>`;
  $("#page").innerHTML = `<div class="pwrap">
    <div class="ptop"><button class="ico flat" data-act="back" aria-label="back">${I.back}</button></div>
    <div class="eyebrow">${I.leaf} ${esc(t("step2"))}</div>
    <h1 class="ptitle serif">${esc(t("step2Title"))}</h1>
    ${ms.length > 1 ? `<div class="seg">${ms.map(m => `<button data-m="${m}" class="${m === method ? "on" : ""}">${esc(t(m === "delivery" ? "methodDelivery" : "methodPickup"))}</button>`).join("")}</div>` : ""}
    ${method === "pickup" ? `<p class="hint">🏪 ${esc(t("pickupAt"))}: ${esc(loc(shop.pickup_address))}</p>` : ""}
    ${progress}
    ${fld("name", t("name"), "Азиз")}
    ${fld("phone", t("phone"), "+998 90 123 45 67", "tel")}
    ${method === "delivery" ? fld("address", t("address"), t("addressPh"), "text", true) : ""}
    <div class="field"><label>${esc(t("comment"))}</label><textarea rows="2" data-f="comment" placeholder="${esc(t("commentPh"))}">${esc(form.comment || "")}</textarea></div>
    <div class="totals"><div><span>${esc(t("subtotal"))} · ${count()} ${plural(count())}</span><span>${esc(money(sub))}</span></div>
      ${method === "delivery" ? `<div><span>${esc(t("deliveryFee"))}</span><span>${esc(feeTxt)}</span></div>` : ""}
      <div class="all"><span>${esc(t("total"))}</span><span>${esc(money(sub + fee()))}</span></div></div>
    <div class="pay"><span>💳</span><span>${esc(loc((shop.payment || {}).info) || t("payDefault"))}</span></div>
    ${showPreview ? `<div class="preview" style="margin:14px 0 0">${esc(t("preview"))}</div>` : ""}
  </div>
  <div class="pbar"><div class="pbar-in"><b>${esc(money(sub + fee()))}</b><button class="btn" id="submit">${esc(t("confirm"))} ${I.arrow}</button></div></div>`;
}

function validate() {
  let ok = true;
  const mark = (k, bad) => { const el = document.getElementById("f-" + k); if (el) el.classList.toggle("err", bad); if (bad) ok = false; };
  mark("name", !(form.name || "").trim());
  mark("phone", (form.phone || "").replace(/\D/g, "").length < 9);
  if (method === "delivery") mark("address", !(form.address || "").trim());
  return ok;
}

function submit() {
  if (!validate()) { haptic("rigid"); const e = $(".field.err"); e && e.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const payload = {
    v: 1, shop: slug, lang, items: cart, method,
    name: form.name.trim().slice(0, 80), phone: form.phone.trim().slice(0, 20),
    address: method === "delivery" ? (form.address || "").trim().slice(0, 300) : "",
    comment: (form.comment || "").trim().slice(0, 300)
  };
  const data = JSON.stringify(payload);
  if (inTG) {
    try { haptic("medium"); tg.sendData(data); return; }      // the app closes, the bot replies in chat
    catch (e) {
      view = "done";
      $("#page").innerHTML = `<div class="pwrap"><div class="done"><div class="ok">💬</div><p>${esc(t("keyboardOnly"))}</p></div></div>`;
      return;
    }
  }
  console.log("Order payload (preview):", data);
  cart = {}; renderCatalog(); renderBar();
  view = "done"; syncBack();
  $("#page").innerHTML = `<div class="pwrap"><div class="done"><div class="ok">🎉</div><h2 class="serif">${esc(t("sent"))}</h2>
    <p>${esc(t("sentText"))}</p><button class="btn" data-act="home">${esc(t("back"))} ${I.arrow}</button>
    ${showPreview ? `<div class="preview" style="margin:18px 0 0">${esc(t("preview"))}</div>` : ""}</div></div>`;
  $("#page").scrollTop = 0;
}

/* ---------- product sheet ---------- */
function openItem(id) {
  const i = byId(id); if (!i) return;
  const facts = [];
  if (loc(i.composition)) facts.push(`<div class="fact"><i>🌸</i><div><b>${esc(t("comp"))}</b>${esc(loc(i.composition))}</div></div>`);
  if (loc(i.size)) facts.push(`<div class="fact"><i>📏</i><div><b>${esc(t("size"))}</b>${esc(loc(i.size))}</div></div>`);
  const n = Math.max(cart[id] || 0, 1);
  $("#panel").innerHTML = `<div class="pin">
    <button class="ico close" data-close aria-label="close">${I.x}</button>
    <div class="big">${thumb(i)}</div>
    <div class="pinfo"><h2 class="serif">${esc(loc(i.title))}</h2>
      <div class="pp">${esc(money(i.price))}</div>
      ${loc(i.description) ? `<p>${esc(loc(i.description))}</p>` : ""}
      ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
      ${i.photo && shop.photo_note ? `<p class="note">${esc(loc(shop.photo_note))}</p>` : ""}
      <div class="addrow"><div class="qty soft"><button data-sq="-1" aria-label="-">${I.minus}</button><b id="sq">${n}</b><button data-sq="1" aria-label="+">${I.plus}</button></div>
        <button class="btn" data-addq="${esc(i.id)}">${esc(t("add"))} · <span id="sqSum">${esc(money(i.price * n))}</span></button></div>
    </div></div>`;
  $("#sheet").classList.add("open");
  $("#panel").scrollTop = 0;
  lockScroll(); syncBack(); renderBar();
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  lockScroll(); syncBack(); renderBar();
}

/* ---------- events (one delegated handler) ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-open],[data-close]"); if (!el) return;
  const ds = el.dataset;
  if ("close" in ds) return closeSheet();
  if (el.id === "pill") return showPage("cart");
  if (el.id === "submit") return submit();
  if (ds.lang) { lang = ds.lang; render(); if (view === "cart" || view === "checkout") renderPage(); return; }
  if (ds.tab) return scrollToSec(+ds.tab);
  if (ds.open) return openItem(ds.open);
  if (ds.inc) { const first = !cart[ds.inc]; inc(ds.inc); if (first && !view) toast("✅ " + t("added")); return refreshBuy(ds.inc); }
  if (ds.dec) { dec(ds.dec); return refreshBuy(ds.dec); }
  if (ds.del) { delete cart[ds.del]; haptic("medium"); return refreshBuy(ds.del); }
  if (ds.sq) {
    const id = $("[data-addq]").dataset.addq, out = $("#sq");
    const n = Math.max(1, Math.min(99, +out.textContent + +ds.sq)); out.textContent = n;
    $("#sqSum").textContent = money(byId(id).price * n); return haptic("light");
  }
  if (ds.addq) { cart[ds.addq] = +$("#sq").textContent; haptic("medium"); closeSheet(); refreshBuy(ds.addq); return view ? null : toast("✅ " + t("added")); }
  if (ds.m) { method = ds.m; return renderCheckout(); }
  switch (ds.act) {
    case "cart": return showPage("cart");
    case "checkout": return openCheckout();
    case "back": return goBack();
    case "home": return closePage();
    case "clear": cart = {}; haptic("medium"); renderCatalog(); renderBar(); return renderCart();
    case "catalog": return scrollToSec(+(($("[data-sec]") || {}).dataset || {}).sec || 0);
    case "search": {
      searching = true; renderNav(); renderCatalog();
      const nav = $("#tabs");
      window.scrollTo({ top: $("#catalog").getBoundingClientRect().top + scrollY - nav.offsetHeight - 4 });
      const inp = $("#q"); inp && inp.focus();
      return;
    }
    case "unsearch": searching = false; q = ""; renderNav(); renderCatalog(); activeTab = -1; return spy();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; return renderCatalog(); }
  const k = e.target.dataset && e.target.dataset.f;
  if (k) { form[k] = e.target.value; const fe = document.getElementById("f-" + k); fe && fe.classList.remove("err"); }
});

/* ---------- start ---------- */
(async function init() {
  if (inTG) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    if (tg.BackButton) tg.BackButton.onClick(goBack);
  }
  const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) document.documentElement.dataset.theme = "dark";
  try {
    const r = await fetch(`shops/${slug}.json`, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    shop = await r.json();
  } catch (e) {
    $("#app").innerHTML = `<div class="loading" style="font-size:15px;padding:0 24px;text-align:center">${esc(T.ru.loadErr)}<br><br>${esc(T.uz.loadErr)}</div>`;
    return;
  }
  const langs = (shop.languages || ["ru"]).filter(l => T[l]);
  const want = qs.get("lang") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "";
  lang = langs.includes(want) ? want : (langs.includes(shop.default_language) ? shop.default_language : langs[0] || "ru");
  if (shop.theme && /^#[0-9a-f]{6}$/i.test(shop.theme.accent || "")) document.documentElement.style.setProperty("--accent", shop.theme.accent);
  index();
  render();
  if (inTG) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    try { if (tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } } catch (e) {}
  }
})();
</script>
</body>
</html>
